<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Image to JSON Converter Ultra HD & Optimized</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f0f14; 
            color: #f0f0f5; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            gap: 20px; 
            min-height: 100vh;
            justify-content: center;
        }
        .main-container {
            display: flex;
            gap: 20px;
            max-width: 1050px;
            width: 100%;
        }
        .panel { 
            background: #181822; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.6); 
            border: 1px solid #282836;
        }
        .left-panel { 
            width: 380px; 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            flex-shrink: 0;
        }
        .right-panel { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start;
            gap: 12px;
            background: #12121a;
        }
        h2 { margin: 0; color: #4da6ff; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; color: #aaa; font-weight: 600; display: flex; justify-content: space-between; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        input[type="range"] { flex: 1; accent-color: #0073e6; cursor: pointer; }
        input[type="number"] { 
            width: 75px; 
            background: #242432; 
            border: 1px solid #3d3d52; 
            color: #fff; 
            padding: 6px; 
            border-radius: 6px; 
            text-align: center; 
            font-size: 13px;
            font-weight: bold;
        }
        input[type="file"] {
            background: #242432;
            border: 1px dashed #444;
            padding: 10px;
            border-radius: 8px;
            color: #ccc;
            cursor: pointer;
            width: 100%;
        }
        
        .preview-viewport {
            width: 500px;
            height: 500px;
            background: #08080c;
            border: 2px solid #2a2a3d;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .preview-canvas {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #4da6ff;
            cursor: pointer;
            user-select: none;
            background: #222230;
            padding: 8px 12px;
            border-radius: 6px;
            width: 100%;
        }
        .toggle-row input { cursor: pointer; accent-color: #0073e6; width: 16px; height: 16px; }

        .stats-box { 
            background: #222230; 
            padding: 12px; 
            border-radius: 8px; 
            border-left: 4px solid #0073e6; 
            font-size: 13px; 
            line-height: 1.6; 
        }
        .stats-box strong { color: #58a6ff; }
        .badge-green { color: #28c05a; font-weight: bold; }
        
        .btn { 
            background: #23a04b; 
            color: white; 
            border: none; 
            padding: 13px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s; 
            font-size: 14px;
        }
        .btn:hover { background: #28c05a; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="panel left-panel">
        <h2>⚡ Оптимизатор Изображений</h2>
        
        <div class="group">
            <label>Выберите изображение:</label>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="group">
            <label><span>Детализация (Ширина в px):</span></label>
            <div class="input-row">
                <input type="range" id="resSlider" min="10" max="300" value="60">
                <input type="number" id="resInput" value="60" min="10" max="300">
            </div>
        </div>

        <!-- Оптимизация (Greedy Meshing) -->
        <label class="toggle-row">
            <input type="checkbox" id="optimizeToggle" checked>
            <span>🚀 Объединять блоки (Greedy Mesh)</span>
        </label>

        <div class="group">
            <label><span>Допуск цвета (Tolerance):</span></label>
            <div class="input-row">
                <input type="range" id="tolSlider" min="0" max="100" value="15">
                <input type="number" id="tolInput" value="15" min="0" max="100">
            </div>
        </div>

        <div class="group">
            <label><span>Упрощение палитры (Убирает шум):</span></label>
            <div class="input-row">
                <input type="range" id="palSlider" min="1" max="30" value="1">
                <input type="number" id="palInput" value="1" min="1" max="30">
            </div>
        </div>

        <div class="group">
            <label><span>Размер пикселя X/Y (студы):</span></label>
            <div class="input-row">
                <input type="range" id="sizeSlider" min="0.01" max="1.0" step="0.01" value="0.05">
                <input type="number" id="sizeInput" value="0.05" step="0.01" min="0.01" max="1.0">
            </div>
        </div>

        <div class="group">
            <label><span>Толщина блока Z (студы):</span></label>
            <div class="input-row">
                <input type="range" id="thickSlider" min="0.01" max="1.0" step="0.01" value="0.05">
                <input type="number" id="thickInput" value="0.05" step="0.01" min="0.01" max="1.0">
            </div>
        </div>

        <label class="toggle-row">
            <input type="checkbox" id="studsToggle" checked>
            <span>🧱 Отображать границы блоков</span>
        </label>

        <div class="stats-box">
            <div>📍 Исходно пикселей: <strong id="rawPixelsCount">0</strong></div>
            <div>📦 Блоков в игре: <strong id="totalBlocksCount" class="badge-green">0</strong></div>
            <div>⚡ Экономия: <strong id="savingsPercent" class="badge-green">0%</strong></div>
            <div>📐 Габариты: <strong id="dimensions">0 x 0 x 0</strong> студов</div>
        </div>

        <button class="btn" id="downloadBtn">📥 Скачать JSON для Roblox</button>
    </div>

    <div class="panel right-panel">
        <h2>👁️ Превью Постройки</h2>
        <div class="preview-viewport">
            <canvas id="previewCanvas" class="preview-canvas"></canvas>
        </div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const resSlider = document.getElementById('resSlider');
    const resInput = document.getElementById('resInput');
    const tolSlider = document.getElementById('tolSlider');
    const tolInput = document.getElementById('tolInput');
    const palSlider = document.getElementById('palSlider');
    const palInput = document.getElementById('palInput');
    const sizeSlider = document.getElementById('sizeSlider');
    const sizeInput = document.getElementById('sizeInput');
    const thickSlider = document.getElementById('thickSlider');
    const thickInput = document.getElementById('thickInput');
    const studsToggle = document.getElementById('studsToggle');
    const optimizeToggle = document.getElementById('optimizeToggle');
    
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    
    let loadedImage = null;
    let optimizedBlocks = [];
    let rawPixelsCount = 0;

    function setupSync(slider, input, callback) {
        slider.addEventListener('input', () => { input.value = slider.value; callback(); });
        input.addEventListener('input', () => { 
            let val = parseFloat(input.value);
            if (!isNaN(val)) { slider.value = val; callback(); }
        });
    }

    setupSync(resSlider, resInput, processImage);
    setupSync(tolSlider, tolInput, processImage);
    setupSync(palSlider, palInput, processImage);
    setupSync(sizeSlider, sizeInput, updateStats);
    setupSync(thickSlider, thickInput, updateStats);
    studsToggle.addEventListener('change', renderPreview);
    optimizeToggle.addEventListener('change', processImage);

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            loadedImage = new Image();
            loadedImage.onload = () => processImage();
            loadedImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    // Простая и предсказуемая дистанция цвета (Manhattan Distance)
    function colorDistance(c1, c2) {
        return Math.abs(c1[0] - c2[0]) + Math.abs(c1[1] - c2[1]) + Math.abs(c1[2] - c2[2]);
    }

    // Принудительное убирание микро-шума (Постеризация)
    function applyPaletteReduction(color, step) {
        if (step <= 1) return color;
        return [
            Math.round(color[0] / step) * step,
            Math.round(color[1] / step) * step,
            Math.round(color[2] / step) * step
        ];
    }

    function processImage() {
        if (!loadedImage) return;

        const targetWidth = parseInt(resInput.value) || 60;
        const aspectRatio = loadedImage.height / loadedImage.width;
        const targetHeight = Math.round(targetWidth * aspectRatio);
        const tolerance = parseInt(tolInput.value) || 0;
        const palStep = parseInt(palInput.value) || 1;
        const doOptimize = optimizeToggle.checked;

        const offCanvas = document.createElement('canvas');
        offCanvas.width = targetWidth;
        offCanvas.height = targetHeight;
        const offCtx = offCanvas.getContext('2d');
        offCtx.drawImage(loadedImage, 0, 0, targetWidth, targetHeight);
        const imgData = offCtx.getImageData(0, 0, targetWidth, targetHeight).data;

        // Создаем 2D сетку пикселей
        const grid = Array.from({ length: targetHeight }, () => new Array(targetWidth).fill(null));
        rawPixelsCount = 0;

        for (let y = 0; y < targetHeight; y++) {
            for (let x = 0; x < targetWidth; x++) {
                const idx = (y * targetWidth + x) * 4;
                const a = imgData[idx + 3];
                if (a > 50) {
                    let color = [imgData[idx], imgData[idx + 1], imgData[idx + 2]];
                    if (palStep > 1) {
                        color = applyPaletteReduction(color, palStep * 5);
                    }
                    grid[y][x] = color;
                    rawPixelsCount++;
                }
            }
        }

        optimizedBlocks = [];

        if (!doOptimize) {
            for (let y = 0; y < targetHeight; y++) {
                for (let x = 0; x < targetWidth; x++) {
                    if (grid[y][x]) {
                        optimizedBlocks.push({
                            x: x,
                            y: (targetHeight - 1) - y,
                            w: 1,
                            h: 1,
                            color: grid[y][x]
                        });
                    }
                }
            }
        } else {
            // Классический проверенный Greedy Meshing
            const visited = Array.from({ length: targetHeight }, () => new Array(targetWidth).fill(false));

            for (let y = 0; y < targetHeight; y++) {
                for (let x = 0; x < targetWidth; x++) {
                    if (visited[y][x] || !grid[y][x]) continue;

                    const baseColor = grid[y][x];

                    // 1. Расширяем по ширине (X)
                    let w = 1;
                    while (x + w < targetWidth && !visited[y][x + w] && grid[y][x + w] && colorDistance(baseColor, grid[y][x + w]) <= tolerance) {
                        w++;
                    }

                    // 2. Расширяем по высоте (Y)
                    let h = 1;
                    let canExpandY = true;
                    while (y + h < targetHeight && canExpandY) {
                        for (let k = 0; k < w; k++) {
                            if (visited[y + h][x + k] || !grid[y + h][x + k] || colorDistance(baseColor, grid[y + h][x + k]) > tolerance) {
                                canExpandY = false;
                                break;
                            }
                        }
                        if (canExpandY) h++;
                    }

                    // Помечаем посещенными
                    for (let dy = 0; dy < h; dy++) {
                        for (let dx = 0; dx < w; dx++) {
                            visited[y + dy][x + dx] = true;
                        }
                    }

                    optimizedBlocks.push({
                        x: x,
                        y: (targetHeight - 1) - (y + h - 1),
                        w: w,
                        h: h,
                        color: baseColor
                    });
                }
            }
        }

        renderPreview();
    }

    function renderPreview() {
        if (!loadedImage) return;

        const targetWidth = parseInt(resInput.value) || 60;
        const aspectRatio = loadedImage.height / loadedImage.width;
        const targetHeight = Math.round(targetWidth * aspectRatio);

        const maxBoxSize = 500;
        let cellSize = Math.floor(maxBoxSize / Math.max(targetWidth, targetHeight));
        if (cellSize < 1) cellSize = 1;

        canvas.width = targetWidth * cellSize;
        canvas.height = targetHeight * cellSize;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const drawStuds = studsToggle.checked;

        for (const block of optimizedBlocks) {
            const drawX = block.x * cellSize;
            const drawY = ((targetHeight - 1) - (block.y + block.h - 1)) * cellSize;
            const drawW = block.w * cellSize;
            const drawH = block.h * cellSize;

            ctx.fillStyle = `rgb(${block.color[0]}, ${block.color[1]}, ${block.color[2]})`;
            ctx.fillRect(drawX, drawY, drawW, drawH);

            if (drawStuds) {
                ctx.strokeStyle = "rgba(0, 0, 0, 0.4)";
                ctx.lineWidth = 1;
                ctx.strokeRect(drawX, drawY, drawW, drawH);
            }
        }

        updateStats();
    }

    function updateStats() {
        const count = optimizedBlocks.length;
        const pxSize = parseFloat(sizeInput.value) || 0.05;
        const thick = parseFloat(thickInput.value) || 0.05;

        document.getElementById('rawPixelsCount').innerText = rawPixelsCount.toLocaleString();
        document.getElementById('totalBlocksCount').innerText = count.toLocaleString();

        const saved = rawPixelsCount > 0 ? Math.round((1 - (count / rawPixelsCount)) * 100) : 0;
        document.getElementById('savingsPercent').innerText = saved + "%";

        if (loadedImage) {
            const targetWidth = parseInt(resInput.value) || 60;
            const targetHeight = Math.round(targetWidth * (loadedImage.height / loadedImage.width));
            const widthStuds = (targetWidth * pxSize).toFixed(2);
            const heightStuds = (targetHeight * pxSize).toFixed(2);
            document.getElementById('dimensions').innerText = `${widthStuds} x ${heightStuds} x ${thick.toFixed(2)}`;
        }
    }

    document.getElementById('downloadBtn').addEventListener('click', () => {
        if (optimizedBlocks.length === 0) return alert("Сначала загрузите картинку!");
        
        const data = {
            pixelSize: parseFloat(sizeInput.value) || 0.05,
            thickness: parseFloat(thickInput.value) || 0.05,
            blocks: optimizedBlocks
        };

        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'image.json';
        a.click();
    });
</script>
</body>
</html>
