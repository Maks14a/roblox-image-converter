<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Image to JSON Converter HD</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #121218; 
            color: #fff; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            gap: 20px; 
            min-height: 100vh;
        }
        .panel { 
            background: #1e1e28; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        .left-panel { 
            width: 360px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            flex-shrink: 0;
        }
        .right-panel { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 400px; 
            background: #181822;
        }
        h2 { margin-top: 0; color: #4da6ff; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 12px; color: #aaa; font-weight: 600; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        input[type="range"] { flex: 1; accent-color: #0073e6; cursor: pointer; }
        input[type="number"] { 
            width: 75px; 
            background: #2a2a38; 
            border: 1px solid #444; 
            color: #fff; 
            padding: 6px; 
            border-radius: 6px; 
            text-align: center; 
            font-size: 13px;
        }
        input[type="file"] {
            background: #2a2a38;
            border: 1px dashed #555;
            padding: 10px;
            border-radius: 6px;
            color: #ccc;
            cursor: pointer;
        }
        canvas { 
            border: 2px dashed #444; 
            border-radius: 8px; 
            max-width: 100%; 
            max-height: 500px; 
            background: #0a0a0e; 
            image-rendering: pixelated; 
        }
        .stats-box { 
            background: #282836; 
            padding: 12px; 
            border-radius: 8px; 
            border-left: 4px solid #0073e6; 
            font-size: 13px; 
            line-height: 1.6; 
        }
        .stats-box strong { color: #58a6ff; }
        .btn { 
            background: #23a04b; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s; 
            font-size: 14px;
        }
        .btn:hover { background: #28c05a; }
    </style>
</head>
<body>

<div class="panel left-panel">
    <h2>⚙️ Настройки картинки</h2>
    
    <div class="group">
        <label>Выберите изображение:</label>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <!-- Разрешение в пикселях -->
    <div class="group">
        <label>Детализация (ширина в пикселях):</label>
        <div class="input-row">
            <input type="range" id="resSlider" min="10" max="200" value="40">
            <input type="number" id="resInput" value="40" min="10" max="200">
        </div>
    </div>

    <!-- Размер 1 пикселя в студах -->
    <div class="group">
        <label>Размер пикселя X/Y (в студах):</label>
        <div class="input-row">
            <input type="range" id="sizeSlider" min="0.01" max="1.0" step="0.01" value="0.05">
            <input type="number" id="sizeInput" value="0.05" step="0.01" min="0.01" max="1.0">
        </div>
    </div>

    <!-- Толщина блока в студах -->
    <div class="group">
        <label>Толщина блока Z (в студах):</label>
        <div class="input-row">
            <input type="range" id="thickSlider" min="0.01" max="1.0" step="0.01" value="0.05">
            <input type="number" id="thickInput" value="0.05" step="0.01" min="0.01" max="1.0">
        </div>
    </div>

    <!-- Блок со статистикой -->
    <div class="stats-box">
        <div>📦 Всего блоков: <strong id="totalBlocks">0</strong> шт</div>
        <div>📐 Габариты: <strong id="dimensions">0 x 0 x 0</strong> студов</div>
        <div>🏷️ Масштаб: <strong id="scaleTag">Загрузите фото</strong></div>
    </div>

    <button class="btn" id="downloadBtn">📥 Скачать JSON для Roblox</button>
</div>

<div class="panel right-panel">
    <h2>👁️ Превью постройки (Real-Time)</h2>
    <canvas id="previewCanvas"></canvas>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const resSlider = document.getElementById('resSlider');
    const resInput = document.getElementById('resInput');
    const sizeSlider = document.getElementById('sizeSlider');
    const sizeInput = document.getElementById('sizeInput');
    const thickSlider = document.getElementById('thickSlider');
    const thickInput = document.getElementById('thickInput');
    
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    
    let loadedImage = null;
    let generatedPixels = [];

    // Двусторонняя синхронизация Слайдер <-> Инпут с мгновенным Live-обновлением
    function setupSync(slider, input, callback) {
        slider.addEventListener('input', () => { 
            input.value = slider.value; 
            callback(); 
        });
        input.addEventListener('input', () => { 
            let val = parseFloat(input.value);
            if (!isNaN(val)) {
                slider.value = val; 
                callback(); 
            }
        });
    }

    setupSync(resSlider, resInput, processImage);
    setupSync(sizeSlider, sizeInput, updateStats);
    setupSync(thickSlider, thickInput, updateStats);

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            loadedImage = new Image();
            loadedImage.onload = () => processImage();
            loadedImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    function processImage() {
        if (!loadedImage) return;

        const targetWidth = parseInt(resInput.value) || 40;
        const aspectRatio = loadedImage.height / loadedImage.width;
        const targetHeight = Math.round(targetWidth * aspectRatio);

        canvas.width = targetWidth;
        canvas.height = targetHeight;

        ctx.drawImage(loadedImage, 0, 0, targetWidth, targetHeight);
        const imgData = ctx.getImageData(0, 0, targetWidth, targetHeight).data;

        generatedPixels = [];
        for (let y = 0; y < targetHeight; y++) {
            for (let x = 0; x < targetWidth; x++) {
                const index = (y * targetWidth + x) * 4;
                const a = imgData[index + 3];
                if (a > 50) { // Игнорируем прозрачные пиксели
                    generatedPixels.push({
                        x: x,
                        y: (targetHeight - 1) - y, // Точная координатная сетка без сдвигов
                        color: [imgData[index], imgData[index + 1], imgData[index + 2]]
                    });
                }
            }
        }
        updateStats();
    }

    function updateStats() {
        const count = generatedPixels.length;
        const pxSize = parseFloat(sizeInput.value) || 0.05;
        const thick = parseFloat(thickInput.value) || 0.05;
        
        document.getElementById('totalBlocks').innerText = count.toLocaleString();

        if (canvas.width && canvas.height) {
            const widthStuds = (canvas.width * pxSize).toFixed(2);
            const heightStuds = (canvas.height * pxSize).toFixed(2);
            document.getElementById('dimensions').innerText = `${widthStuds} x ${heightStuds} x ${thick.toFixed(2)}`;

            let tag = "";
            if (widthStuds < 5) tag = "🔍 Крошечное (с ладошку)";
            else if (widthStuds < 20) tag = "🧍 Среднее (в рост игрока)";
            else if (widthStuds < 60) tag = "🏢 Большое (стена дома)";
            else tag = "🚨 ОГРОМНОЕ (на всю карту!)";

            document.getElementById('scaleTag').innerText = tag;
        }
    }

    document.getElementById('downloadBtn').addEventListener('click', () => {
        if (generatedPixels.length === 0) return alert("Сначала загрузите картинку!");
        
        const data = {
            pixelSize: parseFloat(sizeInput.value) || 0.05,
            thickness: parseFloat(thickInput.value) || 0.05,
            width: canvas.width,
            height: canvas.height,
            pixels: generatedPixels
        };

        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'image.json';
        a.click();
    });
</script>
</body>
</html>
