<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Roblox Image Converter HD</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #121218; color: #e1e1e6; text-align: center; padding: 20px; }
        .box { background: #1e1e26; padding: 25px; border-radius: 12px; display: inline-block; max-width: 480px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid #2d2d3a; }
        label { display: block; text-align: left; margin-top: 14px; font-weight: 600; font-size: 13px; color: #a0a0b0; }
        input, button { margin: 6px 0; padding: 12px; width: 100%; border-radius: 6px; border: 1px solid #333344; background: #282836; color: #fff; box-sizing: border-box; font-size: 13px; }
        button { background: #28a745; font-weight: bold; cursor: pointer; border: none; margin-top: 18px; font-size: 14px; transition: 0.2s; }
        button:hover { background: #218838; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="margin-top:0; color:#fff;">⚡ Roblox Image Converter</h2>
    
    <label>1. Выберите файл картинки:</label>
    <input type="file" id="imageInput" accept="image/*">

    <label>2. Детализация (Ширина картинки в пикселях/блоках):</label>
    <input type="number" id="qualityInput" value="60" min="5" max="500" placeholder="Например: 100 (для высокой детализации)">

    <label>3. Физический размер 1 пикселя в студах (например: 0.05):</label>
    <input type="number" id="blockSizeInput" value="0.05" step="0.01" min="0.001" max="50" placeholder="Например: 0.05 или 1">

    <button onclick="convertAndDownload()">🚀 Конвертировать и скачать image.json</button>
</div>

<canvas id="canvas"></canvas>

<script>
function convertAndDownload() {
    const fileInput = document.getElementById('imageInput');
    const quality = parseInt(document.getElementById('qualityInput').value) || 60;
    const blockSize = parseFloat(document.getElementById('blockSizeInput').value) || 0.05;

    if (!fileInput.files[0]) {
        alert("Пожалуйста, выберите файл картинки!");
        return;
    }

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            const aspectRatio = img.height / img.width;
            const width = quality;
            const height = Math.round(width * aspectRatio);

            canvas.width = width;
            canvas.height = height;

            ctx.drawImage(img, 0, 0, width, height);

            const imgData = ctx.getImageData(0, 0, width, height).data;
            const pixels = [];

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const index = (y * width + x) * 4;
                    const r = imgData[index];
                    const g = imgData[index + 1];
                    const b = imgData[index + 2];
                    const a = imgData[index + 3];

                    if (a > 50) {
                        pixels.push({
                            x: x,
                            y: height - y - 1,
                            color: [r, g, b]
                        });
                    }
                }
            }

            const resultObject = {
                blockSize: blockSize,
                gridWidth: width,
                gridHeight: height,
                pixels: pixels
            };

            const jsonStr = JSON.stringify(resultObject);
            const blob = new Blob([jsonStr], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "image.json";
            a.click();

            alert("Файл image.json сохранен!\n• Всего блоков: " + pixels.length + "\n• Размер пикселя: " + blockSize + " студ.");
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}
</script>
</body>
</html>
